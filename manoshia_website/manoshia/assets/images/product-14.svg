<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b4aa96" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8bfaa" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8bfaa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c8bfaa" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg14)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid14" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c8bfaa" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid14)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- waistband -->
      <rect x="148" y="100" width="104" height="22" rx="3" fill="#b4aa96"/>
      <!-- midi skirt flared -->
      <path d="M148 122 L118 380 L282 380 L252 122Z" fill="#c8bfaa" stroke="#0e1c38" stroke-width="1.8"/>
      <!-- drape lines -->
      <path d="M165 130 L140 375" stroke="#0e1c38" stroke-width="1" opacity="0.3"/>
      <path d="M200 122 L200 380" stroke="#0e1c38" stroke-width="1" opacity="0.3"/>
      <path d="M235 130 L260 375" stroke="#0e1c38" stroke-width="1" opacity="0.3"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf14)"/>
  <rect x="0" y="398" width="400" height="1" fill="#c8bfaa" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="69" height="16" rx="2" fill="#2a6b2a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">FASHION</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#5a6e7f">MN-014</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Draped Midi Skirt</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#c8bfaa"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#c8bfaa"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#c8bfaa"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#c8bfaa"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#c8bfaa"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#c8bfaa"/>
  </g>
</svg>