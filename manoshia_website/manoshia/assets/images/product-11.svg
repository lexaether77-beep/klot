<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2a1a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a3a2a" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a3a2a" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg11)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid11" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a3a2a" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid11)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- body -->
      <path d="M148 125 L122 152 L118 315 L282 315 L278 152 L252 125" fill="#1a3a2a" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <!-- sleeves -->
      <path d="M122 152 L85 275 L112 283 L138 178" fill="#1a3a2a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <path d="M278 152 L315 275 L288 283 L262 178" fill="#1a3a2a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- rib collar -->
      <path d="M158 125 L200 112 L242 125 L252 125 L200 138 L148 125Z" fill="#0d2a1a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- rib cuffs -->
      <rect x="83" y="272" width="30" height="14" rx="3" fill="#0d2a1a"/>
      <rect x="287" y="272" width="30" height="14" rx="3" fill="#0d2a1a"/>
      <!-- rib hem -->
      <rect x="116" y="311" width="168" height="17" rx="3" fill="#0d2a1a"/>
      <!-- zip -->
      <line x1="200" y1="125" x2="200" y2="315" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="5,2.5"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf11)"/>
  <rect x="0" y="398" width="400" height="1" fill="#1a3a2a" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="69" height="16" rx="2" fill="#2a6b2a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">FASHION</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-011</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Silk-Touch Bomber</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#1a3a2a"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#1a3a2a"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#1a3a2a"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#1a3a2a"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#1a3a2a"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#1a3a2a"/>
  </g>
</svg>