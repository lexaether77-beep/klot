<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a4a2a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8a6a4a" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a4a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8a6a4a" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg20)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid20" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8a6a4a" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid20)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- body -->
      <path d="M152 160 L128 188 L122 340 L278 340 L272 188 L248 160" fill="#8a6a4a" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <!-- sleeves -->
      <path d="M128 188 L90 310 L118 318 L140 215" fill="#8a6a4a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <path d="M272 188 L310 310 L282 318 L260 215" fill="#8a6a4a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- turtleneck collar -->
      <path d="M162 160 L158 110 Q200 95 242 110 L238 160 Q200 145 162 160Z" fill="#6a4a2a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- rib texture on collar -->
      <line x1="170" y1="110" x2="168" y2="160" stroke="rgba(255,255,255,0.18)" stroke-width="1" opacity="0.25"/>
      <line x1="185" y1="100" x2="183" y2="158" stroke="rgba(255,255,255,0.18)" stroke-width="1" opacity="0.25"/>
      <line x1="200" y1="95" x2="200" y2="160" stroke="rgba(255,255,255,0.18)" stroke-width="1" opacity="0.25"/>
      <line x1="215" y1="100" x2="217" y2="158" stroke="rgba(255,255,255,0.18)" stroke-width="1" opacity="0.25"/>
      <line x1="230" y1="110" x2="232" y2="160" stroke="rgba(255,255,255,0.18)" stroke-width="1" opacity="0.25"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf20)"/>
  <rect x="0" y="398" width="400" height="1" fill="#8a6a4a" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="69" height="16" rx="2" fill="#2a6b2a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">FASHION</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-020</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Merino Turtleneck</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#8a6a4a"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#8a6a4a"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#8a6a4a"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#8a6a4a"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#8a6a4a"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#8a6a4a"/>
  </g>
</svg>