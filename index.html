<style>
/* ============================================================
   KLOT — Main Stylesheet
   Athletic | Jet Black / KLOT Red / White | Bold Geometric
   ============================================================ */

:root {
  /* ── Core Brand (KLOT) ── */
  --navy:        #0D0D0D;
  --navy-mid:    #1a1a1a;
  --green:       #FF2D2D;
  --green-mid:   #e01f1f;
  --green-light: #ff5252;
  --green-pale:  rgba(255,45,45,0.12);
  /* ── Neutrals ── */
  --cream:       #f5f5f5;
  --cream-dark:  #e8e8e8;
  --white:       #ffffff;
  /* ── Legacy gold (admin accents only) ── */
  --gold:        #b8974a;
  --gold-light:  #d4b06a;
  /* ── Utility ── */
  --text:        #0D0D0D;
  --muted:       #666666;
  --border:      rgba(13,13,13,0.12);
  /* ── Storefront accent = KLOT Red ── */
  --accent:      #FF2D2D;
  --accent-light:#ff5252;
}

/* ── Reset ── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Inter',sans-serif; background:var(--white); color:var(--text); overflow-x:hidden; }

a { text-decoration:none; }
button { cursor:pointer; }

/* ── Announcement Bar ── */
#currency-bar {
  background:var(--navy); color:var(--cream);
  padding:8px 20px; font-size:11px; letter-spacing:.15em;
  display:flex; align-items:center; justify-content:space-between;
}
.currency-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; font-size:11px; letter-spacing:.1em; }
.toggle-pill { width:36px; height:18px; background:rgba(255,255,255,.2); border-radius:9px; position:relative; transition:background .3s; }
.toggle-pill::after { content:''; width:14px; height:14px; background:var(--accent-light); border-radius:50%; position:absolute; top:2px; left:2px; transition:left .3s; }
.toggle-pill.usd::after { left:20px; }

/* ── Header ── */
header { position:sticky; top:0; z-index:100; background:var(--white); border-bottom:1px solid var(--border); }
nav { max-width:1400px; margin:0 auto; padding:0 40px; height:72px; display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:10px; cursor:pointer; flex-shrink:0; }
.logo-wordmark { font-family:'Inter',sans-serif; font-size:18px; font-weight:500; letter-spacing:.22em; color:var(--navy); text-transform:uppercase; }
.nav-links { display:flex; gap:36px; list-style:none; margin-left:60px; }
.nav-links a {
  font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--navy); font-weight:400; cursor:pointer;
  position:relative; padding-bottom:2px; transition:color .2s;
}
.nav-links a::after { content:''; position:absolute; bottom:0; left:0; width:0; height:1px; background:var(--green); transition:width .3s; }
.nav-links a:hover::after, .nav-links a.active::after { width:100%; }
.nav-links a:hover, .nav-links a.active { color:var(--green); }
.nav-right { display:flex; align-items:center; gap:20px; }
.cart-btn { background:var(--navy); color:var(--cream); border:none; padding:10px 20px; font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.18em; text-transform:uppercase; transition:background .2s; }
.cart-btn:hover { background:var(--green-mid); }
.cart-count { background:var(--green); color:var(--white); font-size:9px; width:16px; height:16px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin-left:6px; }

/* ── Pages ── */
.page { display:none; }
.page.active { display:block; }

/* ── Buttons ── */
.btn-primary { display:inline-block; background:var(--green); color:var(--white); padding:16px 40px; font-size:10px; letter-spacing:.25em; text-transform:uppercase; border:none; font-family:'Inter',sans-serif; transition:all .3s; }
.btn-primary:hover { background:var(--green-light); transform:translateY(-1px); }
.btn-outline { display:inline-block; border:1px solid var(--navy); color:var(--navy); padding:14px 36px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; background:transparent; font-family:'Inter',sans-serif; transition:all .3s; }
.btn-outline:hover { background:var(--navy); color:var(--cream); }

/* ── Hero ── */
.hero { min-height:calc(100vh - 115px); background:var(--navy); display:grid; grid-template-columns:1fr 1fr; overflow:hidden; }
.hero-text { display:flex; flex-direction:column; justify-content:center; padding:80px; color:var(--cream); }
.hero-eyebrow { font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--green); margin-bottom:24px; }
.hero-title { font-family:'Barlow Condensed',sans-serif; font-size:clamp(52px,6vw,88px); font-weight:400; line-height:1.05; margin-bottom:28px; }
.hero-title em { font-style:italic; color:var(--accent-light); }
.hero-sub { font-family:'Inter',sans-serif; font-size:18px; font-weight:300; color:rgba(245,240,232,.7); line-height:1.7; max-width:380px; margin-bottom:48px; }
.hero-btns { display:flex; gap:16px; flex-wrap:wrap; }
.hero-image { background:#000; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.hero-image-inner { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:40px; }
.hero-logo-img { width:85%; max-width:520px; height:auto; object-fit:contain; filter:drop-shadow(0 0 40px rgba(255,45,45,0.15)); transition:filter .4s; }
.hero-logo-img:hover { filter:drop-shadow(0 0 60px rgba(255,45,45,0.3)); }
.hero-badge { position:absolute; bottom:32px; left:50%; transform:translateX(-50%); font-family:'Inter',sans-serif; font-size:9px; letter-spacing:.35em; text-transform:uppercase; color:rgba(255,255,255,.35); white-space:nowrap; }

/* ── Feature Strip ── */
.feature-strip { background:var(--cream); border-bottom:1px solid var(--border); }
.feature-strip-inner { max-width:1400px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.feature-item { padding:28px 40px; border-right:1px solid var(--border); text-align:center; }
.feature-item:last-child { border-right:none; }
.feature-item h4 { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--navy); margin-bottom:4px; }
.feature-item p { font-family:'Inter',sans-serif; font-size:13px; color:var(--muted); font-style:italic; }

/* ── Sections ── */
.section { padding:100px 40px; max-width:1400px; margin:0 auto; }
.section-label { font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--green); margin-bottom:16px; display:block; }
.section-title { font-family:'Barlow Condensed',sans-serif; font-size:clamp(36px,4vw,56px); font-weight:400; line-height:1.1; color:var(--navy); margin-bottom:20px; }
.section-title em { font-style:italic; color:var(--green); }
.section-sub { font-family:'Inter',sans-serif; font-size:18px; color:var(--muted); line-height:1.7; max-width:560px; }

/* ── Category Cards ── */
.categories { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); margin-top:60px; }
.cat-card { background:var(--white); aspect-ratio:3/4; position:relative; overflow:hidden; cursor:pointer; display:flex; align-items:flex-end; }
.cat-card::after { content:''; position:absolute; bottom:0; left:0; width:0; height:3px; background:var(--green); transition:width .45s cubic-bezier(.25,.46,.45,.94); z-index:4; }
.cat-card:hover::after { width:100%; }
.cat-bg { position:absolute; inset:0; transition:transform .7s cubic-bezier(.25,.46,.45,.94); }
.cat-card:hover .cat-bg { transform:scale(1.06); }
.cat-bg-1 { background:#0d1b2a; }
.cat-bg-2 { background:#1a2d42; }
.cat-bg-3 { background:linear-gradient(160deg,#0d1b2a,#1a3a2a); }
.cat-bg-img { width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }
.cat-overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.3) 45%, rgba(0,0,0,.1) 100%); z-index:1; pointer-events:none; transition:opacity .4s; }
.cat-card:hover .cat-overlay { opacity:.75; }
.cat-label { position:absolute; top:28px; left:32px; font-family:'Barlow Condensed',sans-serif; font-size:10px; letter-spacing:.35em; text-transform:uppercase; color:rgba(245,240,232,.5); z-index:3; }
.cat-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-60%); font-size:72px; opacity:.15; color:var(--accent-light); font-family:'Barlow Condensed',sans-serif; font-style:italic; }
.cat-info { position:relative; z-index:3; padding:32px; width:100%; background:none; transition:transform .4s ease; }
.cat-card:hover .cat-info { transform:translateY(-6px); }
.cat-info h3 { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:400; color:var(--cream); margin-bottom:6px; letter-spacing:.02em; }
.cat-explore { display:inline-flex; align-items:center; gap:8px; font-size:9px; letter-spacing:.25em; text-transform:uppercase; color:var(--green); margin-top:10px; font-family:'Inter',sans-serif; }
.cat-info p { font-size:11px; letter-spacing:.15em; color:var(--accent-light); text-transform:uppercase; }

/* ── Promise ── */
.promise-grid { display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center; }
.promise-image { background:var(--cream-dark); aspect-ratio:4/5; overflow:hidden; position:relative; }
.promise-image img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; transition:transform .7s cubic-bezier(.25,.46,.45,.94); }
.promise-image:hover img { transform:scale(1.04); }
.promise-points { margin-top:40px; display:flex; flex-direction:column; gap:28px; }
.promise-point { border-left:2px solid var(--gold); padding-left:20px; }
.promise-point h4 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--navy); margin-bottom:6px; }
.promise-point p { font-family:'Inter',sans-serif; font-size:16px; color:var(--muted); line-height:1.6; }

/* ── Instagram ── */
.instagram-section { background:var(--cream); padding:80px 40px; text-align:center; }
.instagram-handle { font-family:'Inter',sans-serif; font-size:18px; color:var(--green); font-style:italic; margin-bottom:48px; cursor:pointer; display:block; }
.instagram-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; max-width:1400px; margin:0 auto; }
.insta-item { aspect-ratio:1; position:relative; overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:28px; opacity:.85; transition:opacity .2s; }
.insta-item:hover { opacity:1; }
.insta-overlay { position:absolute; inset:0; background:rgba(13,27,42,.6); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .3s; font-size:11px; letter-spacing:.1em; color:var(--cream); text-transform:uppercase; }
.insta-item:hover .insta-overlay { opacity:1; }

/* ── Page Hero ── */
.page-hero { background:var(--navy); padding:80px 40px; text-align:center; position:relative; overflow:hidden; }
.page-hero::before { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200px; height:230px; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 60 70' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='17' height='28' fill='%23b8974a'/%3E%3Crect x='0' y='32' width='17' height='38' fill='%23b8974a'/%3E%3Crect x='21.5' y='10' width='17' height='18' fill='%23b8974a'/%3E%3Crect x='21.5' y='32' width='17' height='38' fill='%23b8974a'/%3E%3Crect x='43' y='0' width='17' height='28' fill='%23b8974a'/%3E%3Crect x='43' y='32' width='17' height='38' fill='%23b8974a'/%3E%3C/svg%3E"); background-size:contain; background-repeat:no-repeat; background-position:center; opacity:.05; pointer-events:none; }
.page-hero h1 { font-family:'Barlow Condensed',sans-serif; font-size:clamp(48px,6vw,80px); font-weight:400; color:var(--cream); line-height:1.05; position:relative; }
.page-hero h1 em { font-style:italic; color:var(--accent-light); }
.page-hero p { font-family:'Inter',sans-serif; font-size:20px; color:rgba(245,240,232,.65); margin-top:16px; position:relative; }

/* ── Filter Bar ── */
.filter-bar { background:var(--cream); border-bottom:1px solid var(--border); padding:20px 40px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; max-width:1400px; margin:0 auto; }
.filter-label { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-right:8px; }
.filter-btn { padding:8px 18px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; border:1px solid var(--border); background:var(--white); color:var(--navy); font-family:'Inter',sans-serif; transition:all .2s; }
.filter-btn:hover, .filter-btn.active { background:var(--navy); color:var(--cream); border-color:var(--navy); }

/* ── Product Grid ── */
.product-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); max-width:1400px; margin:0 auto; }
.product-card { background:var(--white); cursor:pointer; position:relative; overflow:hidden; }
.product-img { aspect-ratio:3/4; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.product-img-bg { position:absolute; inset:0; transition:transform .5s ease; }
.product-card:hover .product-img-bg { transform:scale(1.05); }
.product-img-icon { position:relative; z-index:1; }
.product-badge { position:absolute; top:16px; left:16px; background:var(--green); color:var(--white); font-size:8px; letter-spacing:.15em; text-transform:uppercase; padding:4px 10px; z-index:2; }
.product-actions { position:absolute; bottom:0; left:0; right:0; padding:16px; background:linear-gradient(transparent,rgba(13,27,42,.85)); transform:translateY(100%); transition:transform .3s; z-index:2; display:flex; gap:8px; }
.product-card:hover .product-actions { transform:translateY(0); }
.add-cart-btn { flex:1; background:var(--green); color:var(--white); border:none; padding:10px; font-size:9px; letter-spacing:.15em; text-transform:uppercase; font-family:'Inter',sans-serif; transition:background .2s; }
.add-cart-btn:hover { background:var(--accent-light); }
.wishlist-btn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:var(--white); padding:10px 14px; font-size:14px; transition:background .2s; }
.wishlist-btn:hover { background:rgba(255,255,255,.3); }
.product-info { padding:20px; border-top:1px solid var(--border); }
.product-category { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--green); margin-bottom:6px; }
.product-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:400; color:var(--navy); margin-bottom:6px; line-height:1.3; }
.product-sizes { font-size:10px; color:var(--muted); letter-spacing:.08em; margin-bottom:10px; }
.product-price { font-family:'Inter',sans-serif; font-size:20px; font-weight:500; color:var(--navy); }

/* ── Product Detail Page (PDP) ── */
.pdp-back { display:flex; align-items:center; gap:8px; padding:32px 40px 0; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); cursor:pointer; border:none; background:none; font-family:'Inter',sans-serif; transition:color .2s; }
.pdp-back:hover { color:var(--navy); }
.pdp-back svg { transition:transform .2s; }
.pdp-back:hover svg { transform:translateX(-3px); }
.pdp-layout { max-width:1300px; margin:0 auto; padding:40px 40px 80px; display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:start; }
.pdp-gallery {}
.pdp-viewer { position:relative; aspect-ratio:4/5; background:#f5f5f5; overflow:hidden; cursor:zoom-in; }
.pdp-viewer img { width:100%; height:100%; object-fit:contain; transition:transform .08s linear; pointer-events:none; will-change:transform; }
.pdp-viewer.zoomed { cursor:crosshair; }
.pdp-zoom-badge { position:absolute; bottom:16px; right:16px; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); background:var(--white); padding:6px 12px; opacity:.8; pointer-events:none; font-family:'Inter',sans-serif; }
.pdp-thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
.pdp-thumb-wrap {}
.pdp-thumb { aspect-ratio:1; background:#f0f0f0; cursor:pointer; overflow:hidden; border:2px solid transparent; transition:border-color .2s; }
.pdp-thumb.active { border-color:var(--navy); }
.pdp-thumb img { width:100%; height:100%; object-fit:contain; padding:4px; }
.pdp-thumb-label { font-size:8px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); text-align:center; margin-top:4px; font-family:'Inter',sans-serif; }
.pdp-info {}
.pdp-eyebrow { font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:var(--green); margin-bottom:12px; }
.pdp-title { font-family:'Barlow Condensed',sans-serif; font-size:clamp(32px,3.5vw,54px); font-weight:400; color:var(--navy); line-height:1.05; margin-bottom:8px; }
.pdp-subtitle { font-size:13px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-bottom:32px; }
.pdp-price { font-size:30px; font-weight:500; color:var(--navy); margin-bottom:36px; line-height:1; }
.pdp-price-alt { font-size:14px; color:var(--muted); font-weight:400; margin-left:12px; }
.pdp-variants { display:flex; flex-direction:column; gap:24px; margin-bottom:36px; }
.pdp-variant-label { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--navy); margin-bottom:10px; font-family:'Inter',sans-serif; }
.pdp-sizes { display:flex; gap:8px; flex-wrap:wrap; }
.pdp-size-btn { min-width:48px; height:48px; padding:0 10px; border:1px solid var(--border); background:var(--white); font-size:12px; font-family:'Inter',sans-serif; color:var(--navy); cursor:pointer; transition:all .2s; letter-spacing:.05em; }
.pdp-size-btn:hover { border-color:var(--navy); }
.pdp-size-btn.active { background:var(--navy); color:var(--white); border-color:var(--navy); }
.pdp-size-btn.out { opacity:.3; cursor:not-allowed; text-decoration:line-through; }
.pdp-colorways { display:flex; gap:12px; align-items:center; }
.pdp-color-swatch { width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; outline:2px solid transparent; transition:outline-color .2s; box-shadow:0 0 0 1px rgba(0,0,0,.15); }
.pdp-color-swatch.active { outline-color:var(--navy); outline-offset:3px; }
.pdp-color-label { font-size:11px; color:var(--muted); margin-left:4px; font-family:'Inter',sans-serif; }
.pdp-cta { display:flex; gap:10px; margin-bottom:32px; }
.pdp-add-btn { flex:1; background:var(--navy); color:var(--white); border:none; padding:18px 20px; font-size:10px; letter-spacing:.25em; text-transform:uppercase; font-family:'Inter',sans-serif; cursor:pointer; transition:background .25s; }
.pdp-add-btn:hover { background:var(--green); }
.pdp-buy-btn { flex:1; background:var(--green); color:var(--white); border:none; padding:18px 20px; font-size:10px; letter-spacing:.25em; text-transform:uppercase; font-family:'Inter',sans-serif; cursor:pointer; transition:background .25s; }
.pdp-buy-btn:hover { background:var(--green-mid); }
.pdp-perks { display:flex; flex-direction:column; gap:12px; padding-top:24px; border-top:1px solid var(--border); }
.pdp-perk { font-size:11px; color:var(--muted); letter-spacing:.05em; display:flex; align-items:center; gap:12px; font-family:'Inter',sans-serif; }
.pdp-perk::before { content:''; width:20px; height:1px; background:var(--green); flex-shrink:0; }
.pdp-tabs-section { max-width:1300px; margin:0 auto; padding:0 40px 100px; border-top:1px solid var(--border); }
.pdp-tab-header { display:flex; gap:0; margin-bottom:52px; }
.pdp-tab-btn { background:none; border:none; border-bottom:2px solid transparent; padding:24px 36px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); cursor:pointer; margin-bottom:-1px; transition:all .2s; font-family:'Inter',sans-serif; }
.pdp-tab-btn:first-child { padding-left:0; }

.kpop-cta { background:#006A4E; color:#fff; border:none; padding:16px; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.22em; text-transform:uppercase; font-weight:700; cursor:pointer; transition:background .25s; }
.kpop-cta:hover { background:#004d36; }
.kpop-dismiss { display:block; text-align:center; margin-top:14px; font-family:'Inter',sans-serif; font-size:11px; color:#bbb; cursor:pointer; letter-spacing:.06em; background:none; border:none; transition:color .2s; padding:0; }
.kpop-dismiss:hover { color:#555; }
@media (max-width:680px) {
  .kpop { grid-template-columns:1fr; }
  .kpop-visual { min-height:220px; padding:0; }
  .kpop-body { padding:30px 28px; }
  .kpop-title { font-size:34px; }
}

.tpl-guide { background:rgba(0,0,0,.2); border:1px solid rgba(184,151,74,.1); padding:20px; margin-bottom:20px; }
.tpl-guide-title { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--green); margin-bottom:14px; }
.tpl-cols { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tpl-col { padding:10px 12px; background:rgba(255,255,255,.03); border-left:2px solid rgba(184,151,74,.3); }
.tpl-col-name { font-size:11px; color:var(--cream); letter-spacing:.08em; }
.tpl-col-req { font-size:9px; color:#f87171; letter-spacing:.1em; text-transform:uppercase; }
.tpl-col-opt { font-size:9px; color:rgba(245,240,232,.3); letter-spacing:.1em; text-transform:uppercase; }
.tpl-col-desc { font-size:11px; color:rgba(245,240,232,.35); margin-top:2px; font-family:'Inter',sans-serif; }
.validation-panel { display:none; }
.validation-panel.show { display:block; }
.import-actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; }
.error-log { max-height:200px; overflow-y:auto; border:1px solid rgba(248,113,113,.2); }
.error-log-item { padding:9px 14px; border-bottom:1px solid rgba(248,113,113,.08); font-size:12px; display:flex; gap:12px; align-items:flex-start; }
.error-log-row { color:var(--green); font-size:10px; white-space:nowrap; min-width:50px; }
.error-log-msg { color:rgba(245,240,232,.6); font-family:'Inter',sans-serif; font-size:14px; line-height:1.4; }
.error-log-field { color:#fca5a5; font-size:10px; }

/* ── Responsive ── */
@media (max-width:1024px) {
  .hero { grid-template-columns:1fr; min-height:auto; }
  .hero-image { display:none; }
  .hero-text { padding:60px 40px; }
  .product-grid { grid-template-columns:repeat(2,1fr); }
  .footer-grid { grid-template-columns:1fr 1fr; }
  .contact-layout { grid-template-columns:1fr; }
  .about-layout { grid-template-columns:1fr; }
  .about-img { display:none; }
}
@media (max-width:768px) {
  nav { padding:0 20px; }
  .nav-links { display:none; }
  .hero-text { padding:40px 20px; }
  .section { padding:60px 20px; }
  .categories { grid-template-columns:1fr; }
  .team-grid { grid-template-columns:1fr; }
  .instagram-grid { grid-template-columns:repeat(3,1fr); }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .feature-strip-inner { grid-template-columns:1fr 1fr; }
  .contact-info, .contact-form-wrap { padding:40px 20px; }
}

/* ── Brand Ident Icons ── */
.ident-bar {
  background:var(--navy); padding:24px 40px;
  display:flex; align-items:center; justify-content:center; gap:48px;
}
.ident-icon { opacity:.55; transition:opacity .3s; cursor:default; }
.ident-icon:hover { opacity:1; }
.ident-icon svg { display:block; }

/* Essentials sub-brand wordmark */
.essentials-tag {
  display:inline-block; font-family:'Inter',sans-serif;
  font-size:8px; letter-spacing:.35em; text-transform:uppercase;
  color:var(--green); margin-left:2px; vertical-align:super;
  font-weight:500;
}

/* Green section backgrounds */
.section-green { background:var(--green); }
.section-navy  { background:var(--navy); }

/* Feature strip — updated accent */
.feature-item h4 { color:var(--navy); }
.feature-strip-inner .feature-item:nth-child(2n) { background:rgba(42,107,42,.04); }

/* Social links — Font Awesome */
.social-link { font-size:16px !important; }

/* Page hero brand mark watermark using navy #0e1c38 */
.page-hero::before {
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 60 70' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='0' y='0' width='17' height='28' fill='%232a6b2a'/%3E%3Crect x='0' y='32' width='17' height='38' fill='%232a6b2a'/%3E%3Crect x='21.5' y='10' width='17' height='18' fill='%232a6b2a'/%3E%3Crect x='21.5' y='32' width='17' height='38' fill='%232a6b2a'/%3E%3Crect x='43' y='0' width='17' height='28' fill='%232a6b2a'/%3E%3Crect x='43' y='32' width='17' height='38' fill='%232a6b2a'/%3E%3C/svg%3E");
}

/* ── Paystack Checkout Modal ── */
.checkout-overlay {
  position:fixed; inset:0; z-index:600;
  background:rgba(14,28,56,.75); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.checkout-overlay.open { display:flex; }
.checkout-modal {
  background:#0e1c38; border:1px solid rgba(245,240,232,.12);
  width:100%; max-width:580px; max-height:92vh;
  display:flex; flex-direction:column;
  box-shadow:0 40px 100px rgba(0,0,0,.7);
  animation:modalIn .35s cubic-bezier(.22,1,.36,1);
}
.checkout-hdr {
  padding:28px 32px 22px; border-bottom:1px solid rgba(245,240,232,.08);
  display:flex; align-items:flex-start; justify-content:space-between; flex-shrink:0;
}
.checkout-title { font-family:'Barlow Condensed',sans-serif; font-size:22px; color:var(--cream); font-weight:400; margin-bottom:4px; }
.checkout-sub   { font-family:'Inter',sans-serif; font-size:14px; color:rgba(245,240,232,.4); }
.checkout-close { background:none; border:none; color:rgba(245,240,232,.35); font-size:18px; transition:color .2s; cursor:pointer; line-height:1; }
.checkout-close:hover { color:var(--cream); }
.checkout-body  { flex:1; overflow-y:auto; padding:0 32px 8px; }
.checkout-section { padding:22px 0; border-bottom:1px solid rgba(245,240,232,.07); }
.checkout-section:last-child { border-bottom:none; }
.checkout-section-title { font-size:9px; letter-spacing:.25em; text-transform:uppercase; color:var(--green-light); margin-bottom:16px; }
/* Order summary items */
.co-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(245,240,232,.05); }
.co-item:last-child { border-bottom:none; }
.co-item-img { width:48px; height:60px; flex-shrink:0; overflow:hidden; background:rgba(255,255,255,.04); display:flex; align-items:center; justify-content:center; }
.co-item-img img { width:100%; height:100%; object-fit:cover; object-position:top; }
.co-item-name  { font-family:'Barlow Condensed',sans-serif; font-size:14px; color:var(--cream); margin-bottom:3px; }
.co-item-meta  { font-size:11px; color:rgba(245,240,232,.4); letter-spacing:.06em; }
.co-item-price { font-family:'Inter',sans-serif; font-size:18px; color:var(--cream); margin-left:auto; flex-shrink:0; }
.checkout-divider { height:1px; background:rgba(245,240,232,.08); margin:10px 0; }
.checkout-row  { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12px; color:rgba(245,240,232,.5); letter-spacing:.06em; }
.checkout-total-row { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--cream); }
.checkout-total-row span:last-child { font-family:'Barlow Condensed',sans-serif; font-size:22px; color:var(--green-light); letter-spacing:0; text-transform:none; }
/* Form */
.checkout-form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.checkout-field  { margin-bottom:14px; }
.checkout-label  { display:block; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:rgba(245,240,232,.45); margin-bottom:6px; }
.checkout-req    { color:#f87171; font-size:9px; }
.checkout-input  {
  width:100%; padding:11px 14px; background:rgba(255,255,255,.05);
  border:1px solid rgba(245,240,232,.1); color:var(--cream);
  font-family:'Inter',sans-serif; font-size:13px; outline:none;
  transition:border-color .2s; appearance:none;
}
.checkout-input:focus { border-color:var(--green); background:rgba(42,107,42,.06); }
.checkout-input::placeholder { color:rgba(245,240,232,.2); }
.checkout-input option { background:#0e1c38; }
/* Payment info */
.checkout-payment-icons { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.pay-icon { padding:6px 12px; font-size:11px; letter-spacing:.06em; border:1px solid rgba(245,240,232,.12); color:rgba(245,240,232,.55); }
.checkout-payment-note { font-family:'Inter',sans-serif; font-size:14px; color:rgba(245,240,232,.4); line-height:1.6; }
.checkout-currency-note { margin-top:10px; padding:10px 14px; background:rgba(42,107,42,.1); border-left:2px solid var(--green); font-size:12px; color:rgba(245,240,232,.6); letter-spacing:.06em; display:none; }
.checkout-currency-note.show { display:block; }
.checkout-error { font-size:13px; color:#fca5a5; font-family:'Inter',sans-serif; min-height:18px; padding:2px 0 12px; }
/* Footer */
.checkout-ftr {
  padding:20px 32px 24px; border-top:1px solid rgba(245,240,232,.08);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:12px;
}
.checkout-secure-badge { font-size:10px; letter-spacing:.1em; color:rgba(245,240,232,.3); display:flex; align-items:center; gap:6px; }
.checkout-pay-btn {
  background:var(--green); color:var(--white); border:none;
  padding:14px 36px; font-family:'Inter',sans-serif; font-size:11px;
  letter-spacing:.2em; text-transform:uppercase; transition:all .25s; cursor:pointer; flex-shrink:0;
}
.checkout-pay-btn:hover { background:var(--green-light); transform:translateY(-1px); }
.checkout-pay-btn:disabled { background:rgba(42,107,42,.3); cursor:not-allowed; transform:none; }

/* Order Success */
.order-success-overlay {
  position:fixed; inset:0; z-index:700;
  background:rgba(14,28,56,.92); backdrop-filter:blur(8px);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.order-success-overlay.open { display:flex; }
.order-success-box {
  background:#0e1c38; border:1px solid rgba(42,107,42,.4);
  padding:56px 48px; max-width:440px; width:100%; text-align:center;
  animation:modalIn .4s cubic-bezier(.22,1,.36,1);
  box-shadow:0 0 80px rgba(42,107,42,.15);
}
.order-success-icon {
  width:72px; height:72px; border-radius:50%;
  background:rgba(42,107,42,.15); border:2px solid var(--green);
  color:var(--green-light); font-size:32px;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 24px;
}
.order-success-title { font-family:'Barlow Condensed',sans-serif; font-size:28px; color:var(--cream); font-weight:400; margin-bottom:10px; }
.order-success-ref   { font-size:11px; letter-spacing:.18em; color:var(--green-light); margin-bottom:14px; text-transform:uppercase; }
.order-success-msg   { font-family:'Inter',sans-serif; font-size:17px; color:rgba(245,240,232,.55); line-height:1.7; }

/* ── Executive Team Photo Cards ── */
.team-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
.team-card  { background:var(--white); border:1px solid var(--border); overflow:hidden; transition:box-shadow .3s; }
.team-card:hover { box-shadow:0 16px 48px rgba(14,28,56,.1); }

/* Photo wrapper — 3:4 aspect, relative for overlay */
.team-photo-wrap {
  position:relative; overflow:hidden;
  aspect-ratio:3/4; background:var(--cream-dark);
  display:flex; align-items:center; justify-content:center;
}
.team-photo {
  width:100%; height:100%;
  object-fit:cover; object-position:top center;
  display:block; transition:transform .5s ease;
}
.team-card:hover .team-photo { transform:scale(1.03); }

/* Overlay shown on hover — update photo button */
.team-photo-overlay {
  position:absolute; inset:0;
  background:rgba(14,28,56,0); display:flex;
  align-items:flex-end; justify-content:center;
  padding-bottom:20px; transition:background .3s;
  opacity:0;
}
.team-photo-wrap:hover .team-photo-overlay {
  opacity:1; background:rgba(14,28,56,.45);
}
.team-photo-change {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(14,28,56,.85); color:var(--cream);
  padding:9px 18px; font-family:'Inter',sans-serif;
  font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  cursor:pointer; border:1px solid rgba(245,240,232,.25);
  transition:background .2s; white-space:nowrap;
}
.team-photo-change:hover { background:var(--green); border-color:var(--green); }

/* Photo upload progress ring */
.team-photo-uploading::after {
  content:''; position:absolute; inset:0;
  background:rgba(14,28,56,.6);
  display:flex; align-items:center; justify-content:center;
}

/* Info below photo */
.team-info { padding:28px 28px 32px; }
.team-info h4 {
  font-family:'Barlow Condensed',sans-serif;
  font-size:20px; font-weight:400; color:var(--navy);
  margin-bottom:4px;
}
.team-role {
  font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--green); margin-bottom:14px;
}
.team-bio {
  font-family:'Inter',sans-serif;
  font-size:16px; color:var(--muted); line-height:1.75;
}

/* Placeholder state — when no photo loaded */
.team-photo-placeholder {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--cream-dark),var(--cream));
  color:var(--muted); gap:12px;
}
.team-photo-placeholder svg { opacity:.25; }
.team-photo-placeholder span {
  font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; opacity:.5;
}


@media (max-width:1024px) {
  .team-grid { grid-template-columns:1fr 1fr; }
}
@media (max-width:640px) {
  .team-grid { grid-template-columns:1fr; }
}

/* ══════════════════════════════════════════════
   AUTH SYSTEM — Nav + Modal + Profile
   ══════════════════════════════════════════════ */

/* ── Nav auth button ── */
.nav-auth { position:relative; display:flex; align-items:center; margin-right:12px; }

.nav-login-btn {
  display:flex; align-items:center; gap:6px;
  background:transparent; border:1px solid var(--border);
  color:var(--navy); padding:8px 16px;
  font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; transition:all .2s; cursor:pointer;
}
.nav-login-btn:hover { background:var(--navy); color:var(--cream); border-color:var(--navy); }

/* Logged-in avatar button */
.nav-avatar-btn {
  width:36px; height:36px; border-radius:50%;
  background:var(--green); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .2s;
}
.nav-avatar-btn:hover { opacity:.85; }
.nav-avatar-initials {
  font-family:'Inter',sans-serif; font-size:12px;
  font-weight:500; color:white; letter-spacing:.05em; text-transform:uppercase;
}

/* Dropdown */
.user-dropdown {
  position:absolute; top:calc(100% + 10px); right:0;
  background:var(--white); border:1px solid var(--border);
  min-width:210px; box-shadow:0 16px 48px rgba(14,28,56,.12);
  z-index:150; display:none; animation:dropIn .2s ease;
}
@keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.user-dropdown.open { display:block; }
.user-dropdown-name  { padding:14px 16px 2px; font-family:'Barlow Condensed',sans-serif; font-size:15px; color:var(--navy); }
.user-dropdown-email { padding:0 16px 12px; font-size:11px; color:var(--muted); letter-spacing:.04em; overflow:hidden; text-overflow:ellipsis; }
.user-dropdown-divider { height:1px; background:var(--border); margin:2px 0; }
.user-dropdown-item {
  width:100%; text-align:left; background:none; border:none;
  padding:10px 16px; font-family:'Inter',sans-serif; font-size:11px;
  letter-spacing:.08em; color:var(--navy); cursor:pointer;
  transition:background .15s; display:block;
}
.user-dropdown-item:hover { background:var(--cream); }
.user-dropdown-signout { color:#e05555; }
.user-dropdown-signout:hover { background:rgba(224,85,85,.06); }

/* ── Auth Modal ── */
.auth-overlay {
  position:fixed; inset:0; z-index:650;
  background:rgba(14,28,56,.78); backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.auth-overlay.open { display:flex; }
.auth-modal {
  background:var(--white); width:100%; max-width:480px;
  max-height:94vh; overflow-y:auto; position:relative;
  box-shadow:0 40px 100px rgba(14,28,56,.3);
  animation:modalIn .32s cubic-bezier(.22,1,.36,1);
  scrollbar-width:thin;
}
.auth-close {
  position:absolute; top:14px; right:16px;
  background:none; border:none; font-size:16px;
  color:var(--muted); cursor:pointer; z-index:2; transition:color .2s;
}
.auth-close:hover { color:var(--navy); }

/* Tabs */
.auth-tabs {
  display:flex; border-bottom:1px solid var(--border);
}
.auth-tab {
  flex:1; padding:18px; background:none; border:none;
  font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px;
  transition:all .2s;
}
.auth-tab.active { color:var(--green); border-bottom-color:var(--green); }
.auth-tab:hover:not(.active) { color:var(--navy); }

/* Logo */
.auth-logo { display:flex; justify-content:center; padding:28px 0 0; }

/* Panels */
.auth-panel { padding:20px 36px 36px; }
.auth-title {
  font-family:'Barlow Condensed',sans-serif; font-size:22px;
  font-weight:400; color:var(--navy); margin-bottom:4px; text-align:center;
}
.auth-sub {
  font-family:'Inter',sans-serif; font-size:15px;
  color:var(--muted); text-align:center; margin-bottom:24px; line-height:1.5;
}

/* Social auth */
.social-auth-btns { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
.social-auth-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  padding:12px 20px; border:1px solid var(--border); background:var(--white);
  font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.06em;
  color:var(--navy); cursor:pointer; transition:all .2s;
}
.social-auth-btn:hover { background:var(--cream); border-color:var(--navy); }
.social-google:hover   { border-color:#4285F4; }
.social-facebook:hover { border-color:#1877F2; }

/* Divider */
.auth-divider {
  display:flex; align-items:center; gap:12px;
  margin:18px 0; color:var(--muted); font-size:11px; letter-spacing:.08em;
}
.auth-divider::before, .auth-divider::after {
  content:''; flex:1; height:1px; background:var(--border);
}

/* Fields */
.auth-field { margin-bottom:16px; }
.auth-label {
  display:block; font-size:9px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px;
}
.auth-req { color:#e05555; font-size:9px; }
.auth-input {
  width:100%; padding:11px 14px; border:1px solid var(--border);
  background:var(--white); font-family:'Inter',sans-serif; font-size:13px;
  color:var(--navy); outline:none; transition:border-color .2s; appearance:none;
}
.auth-input:focus { border-color:var(--green); background:rgba(42,107,42,.03); }
.auth-input::placeholder { color:var(--muted); opacity:.5; }

/* Password toggle */
.auth-pwd-wrap { position:relative; }
.auth-pwd-wrap .auth-input { padding-right:42px; }
.auth-pwd-toggle {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; color:var(--muted);
  font-size:14px; transition:color .2s;
}
.auth-pwd-toggle:hover { color:var(--navy); }

/* Password strength */
.pwd-strength-bar  { height:3px; background:var(--border); margin-top:6px; overflow:hidden; }
.pwd-strength-fill { height:100%; width:0; transition:width .3s,background .3s; }
.pwd-strength-label { font-size:10px; letter-spacing:.08em; color:var(--muted); margin-top:4px; min-height:14px; }

/* Row layouts */
.auth-row   { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.auth-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.auth-remember {
  display:flex; align-items:center; gap:7px;
  font-size:11px; color:var(--muted); cursor:pointer; letter-spacing:.04em;
}
.auth-remember input { accent-color:var(--green); width:14px; height:14px; }
.auth-forgot, .auth-link {
  background:none; border:none; font-size:11px;
  color:var(--green); cursor:pointer; letter-spacing:.04em; text-decoration:underline;
}

/* GDPR notice */
.auth-gdpr {
  display:flex; align-items:flex-start; gap:7px;
  font-size:11px; color:var(--muted); line-height:1.6;
  background:rgba(42,107,42,.05); border-left:2px solid var(--green);
  padding:10px 12px; margin-bottom:16px;
}
.auth-gdpr svg { flex-shrink:0; margin-top:2px; stroke:var(--green); }

/* Error */
.auth-error {
  font-family:'Inter',sans-serif; font-size:14px;
  color:#e05555; min-height:18px; margin-bottom:10px; text-align:center;
}

/* Submit */
.auth-submit-btn {
  width:100%; padding:15px; background:var(--green); color:white;
  border:none; font-family:'Inter',sans-serif; font-size:11px;
  letter-spacing:.2em; text-transform:uppercase; cursor:pointer;
  transition:background .2s; margin-bottom:16px;
}
.auth-submit-btn:hover    { background:var(--green-light); }
.auth-submit-btn:disabled { background:rgba(42,107,42,.35); cursor:not-allowed; }

.auth-switch {
  text-align:center; font-size:12px; color:var(--muted); letter-spacing:.04em;
}
.auth-switch button {
  background:none; border:none; color:var(--green);
  cursor:pointer; font-size:12px; text-decoration:underline;
}

/* ── Profile panel ── */
.profile-header {
  display:flex; align-items:center; gap:16px; margin-bottom:20px;
  padding:20px; background:var(--cream); border:1px solid var(--border);
}
.profile-avatar {
  width:56px; height:56px; border-radius:50%; background:var(--green);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'Inter',sans-serif; font-size:18px; color:white;
  font-weight:500; text-transform:uppercase;
}
.profile-provider-badge {
  display:inline-block; padding:2px 10px; font-size:9px;
  letter-spacing:.14em; text-transform:uppercase; margin-top:4px;
  background:var(--navy); color:var(--cream);
}

/* ── My orders list ── */
.my-order-row {
  border:1px solid var(--border); padding:14px 16px; margin-bottom:8px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.my-order-id   { font-size:11px; letter-spacing:.1em; color:var(--navy); font-weight:500; }
.my-order-date { font-size:11px; color:var(--muted); }
.my-order-total{ font-family:'Inter',sans-serif; font-size:17px; color:var(--navy); }

var cart = [];
var lastShopPage = 'shop';  // tracks last visited shop/category page
// Auto-detect currency: default NGN for Nigerian locale, USD otherwise
// Respect any prior manual choice stored in localStorage
var currentCurrency = (function() {
  var saved = storageGet('klot_currency');
  if (saved === 'NGN' || saved === 'USD') return saved;
  var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  var tz   = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
  var isNigeria = lang.indexOf('ng') > -1 || lang.indexOf('hausa') > -1 || lang.indexOf('yoruba') > -1 || lang.indexOf('igbo') > -1 || tz.indexOf('Lagos') > -1 || tz.indexOf('Africa') > -1;
  return isNigeria ? 'NGN' : 'USD';
})();

// ── CURRENCY ──
function toggleCurrency() {
  currentCurrency = currentCurrency === 'NGN' ? 'USD' : 'NGN';
  storageSet('klot_currency', currentCurrency);
  var pill = document.getElementById('currency-pill');
  var ngn  = document.getElementById('curr-label-ngn');
  var usd  = document.getElementById('curr-label-usd');
  if (currentCurrency === 'USD') {
    pill.classList.add('usd'); ngn.style.color = ''; usd.style.color = 'var(--gold)';
  } else {
    pill.classList.remove('usd'); ngn.style.color = 'var(--gold)'; usd.style.color = '';
  }
  renderAllGrids();
  updateCartDisplay();
}
function fmtPrice(p) {
  return currentCurrency === 'NGN' ? '\u20A6' + p.priceNGN.toLocaleString() : '$' + p.priceUSD;
}

// ── NAVIGATION ──
function showPage(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById('page-' + page);
  if (el) el.classList.add('active');
  document.querySelectorAll('.nav-links a').forEach(function(a) {
    a.classList.toggle('active', a.dataset.page === page);
  });
  window.scrollTo(0, 0);
  if (page === 'shop')    renderGrid('shop-grid',    products);
  if (page === 'fashion') renderGrid('fashion-grid', products.filter(function(p) { return p.category === 'fashion'; }));
  if (page === 'sports')  renderGrid('sports-grid',  products.filter(function(p) { return p.category === 'sports'; }));
  // Track last shop-type page so order success can return here
  if (['shop','fashion','sports','collections'].indexOf(page) > -1) lastShopPage = page;
}

// ── PRODUCT RENDERING ──
function productCard(p) {
  var tagHtml = p.tag ? '<div class="product-badge">' + (p.tag === 'new' ? 'New' : p.tag === 'limited' ? 'Limited' : p.tag) + '</div>' : '';
  var stockBadge = (p.stock !== undefined && p.stock > 0 && p.stock <= 10)
    ? '<div style="position:absolute;bottom:8px;left:8px;z-index:3;background:rgba(248,113,113,.92);color:#fff;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;font-family:\'Inter\',sans-serif">Only ' + p.stock + ' left</div>'
    : (p.stock === 0 ? '<div style="position:absolute;bottom:8px;left:8px;z-index:3;background:rgba(0,0,0,.7);color:rgba(255,255,255,.6);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;font-family:\'Inter\',sans-serif">Sold Out</div>' : '');
  var imgContent = p.imageUrl
    ? '<img src="' + p.imageUrl + '" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px" onerror="this.style.display=\'none\'" alt="' + p.name + '">'
    : '<span class="product-img-icon">' + LOGO_SVG('#0e1c38', 48) + '</span>';
  var sizeOpts = (p.sizes && p.sizes.indexOf('yr') > -1)
    ? '<option>2Y</option><option>4Y</option><option>6Y</option><option>8Y</option><option>10Y</option><option>12Y</option>'
    : '<option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>';
  return '<div class="product-card" onclick="openPDP(' + p.id + ')">' +
    tagHtml +
    '<div class="product-img">' +
      '<div class="product-img-bg" style="background:' + (p.imageUrl ? '#f5f0e8' : 'linear-gradient(135deg,' + p.color + '88,' + p.color + ')') + '"></div>' +
      imgContent +
      stockBadge +
      '<div class="product-actions">' +
        '<select class="size-select" id="size-' + p.id + '" onclick="event.stopPropagation()"><option value="">Size</option>' + sizeOpts + '</select>' +
        '<button class="add-cart-btn" onclick="event.stopPropagation();addToCart(' + p.id + ')">Add to Bag</button>' +
        '<button class="wishlist-btn" onclick="event.stopPropagation()">\u2661</button>' +
      '</div>' +
    '</div>' +
    '<div class="product-info">' +
      '<div class="product-category">' + p.category + ' \u00B7 ' + (p.style || 'unisex') + '</div>' +
      '<div class="product-name">' + p.name + '</div>' +
      '<div class="product-sizes">' + p.sizes + '</div>' +
      '<div class="product-price">' + fmtPrice(p) + '</div>' +
    '</div>' +
  '</div>';
}

function renderGrid(id, items) {
  var el = document.getElementById(id);
  if (!el) return;
  var active = items.filter(function(p) { return (p.status || 'active') === 'active'; });
  el.innerHTML = active.map(productCard).join('');
}

function renderAllGrids() {
  var sg = document.getElementById('shop-grid');
  if (sg) renderGrid('shop-grid', products);
}

// ── CATEGORY NAV ──
function goToCategory(cat) {
  showPage('shop');
  var btns = document.querySelectorAll('#page-shop .filter-btn');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].textContent.trim().toLowerCase() === cat) { btns[i].click(); break; }

// ── FILTERS ──
function filterProducts(cat, btn) {
  document.querySelectorAll('#page-shop .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');

}
function filterFashion(style, btn) {
  document.querySelectorAll('#page-fashion .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');

  renderGrid('fashion-grid', style === 'all' ? base : base.filter(function(p){return p.style===style;}));
}
function filterSports(act, btn) {
  document.querySelectorAll('#page-sports .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');

// ── PRODUCT DETAIL PAGE ──
var _pdpProduct = null;
var _pdpZoomed = false;

function openPDP(pid) {
  var p = products.find(function(x){ return x.id === pid; });
  if (!p) return;
  _pdpProduct = p;
  _pdpZoomed = false;

  var activePage = document.querySelector('.page.active');
  window._pdpReturn = activePage ? activePage.id.replace('page-','') : 'shop';

  // Main image
  var imgs = p.images || [p.imageUrl, p.image2||p.imageUrl, p.image3||p.imageUrl, p.image4||p.imageUrl];
  var labels = ['Main','Front','Rear','Detail'];
  var mainImg = document.getElementById('pdp-main-img');
  mainImg.src = imgs[0] || '';
  mainImg.alt = p.name;
  mainImg.style.transform = '';
  var viewer = document.getElementById('pdp-viewer');
  viewer.classList.remove('zoomed');
  document.getElementById('pdp-zoom-badge').textContent = '+ Zoom';

  // Thumbnails
  document.getElementById('pdp-thumbs').innerHTML = imgs.slice(0,4).map(function(url,i){
    return '<div class="pdp-thumb-wrap">' +
      '<div class="pdp-thumb' + (i===0?' active':'') + '" onclick="pdpSetImage(\'' + (url||'').replace(/'/g,"\\'") + '\',this)">' +
        '<img src="' + (url||'') + '" alt="' + labels[i] + '" onerror="this.parentElement.style.background=\'#e8e8e8\'">' +
      '</div>' +
      '<div class="pdp-thumb-label">' + labels[i] + '</div>' +
    '</div>';
  }).join('');

  // Eyebrow / title / subtitle / price
  document.getElementById('pdp-eyebrow').textContent = (p.category||'').toUpperCase() + ' · ' + (p.style||'UNISEX').toUpperCase();
  document.getElementById('pdp-title').textContent = p.name;
  document.getElementById('pdp-subtitle').textContent = p.tagline || 'Victory Through Harmony';
  var primary = currentCurrency === 'NGN' ? '₦' + Number(p.priceNGN).toLocaleString() : '$' + p.priceUSD;
  var secondary = currentCurrency === 'NGN' ? '$' + p.priceUSD : '₦' + Number(p.priceNGN).toLocaleString();
  document.getElementById('pdp-price').innerHTML = primary + '<span class="pdp-price-alt">' + secondary + '</span>';

  // Sizes
  var sizes = p.sizeList || (function(){
    if (!p.sizes) return ['XS','S','M','L','XL'];
    if (p.sizes.indexOf('-') > -1) {
      var parts = p.sizes.split('-'), a = parseInt(parts[0]), b = parseInt(parts[1]);
      if (!isNaN(a) && !isNaN(b)) { var r=[]; for(var i=a;i<=b;i++) r.push(String(i)); return r; }
    }
    return p.sizes.split(',').map(function(s){return s.trim();});
  })();
  document.getElementById('pdp-sizes').innerHTML = sizes.map(function(s,i){
    return '<button class="pdp-size-btn' + (i===0?' active':'') + '" onclick="pdpSelectSize(this)">' + s + '</button>';
  }).join('');

  // Stock indicator + sold-out CTA swap
  var stockEl   = document.getElementById('pdp-stock-indicator');
  var ctaMain   = document.getElementById('pdp-cta-main');
  var ctaSoldout= document.getElementById('pdp-cta-soldout');
  var soldOut   = p.stock === 0;
  if (ctaMain)    ctaMain.style.display    = soldOut ? 'none' : '';
  if (ctaSoldout) ctaSoldout.style.display = soldOut ? '' : 'none';
  if (stockEl) {
    if (p.stock !== undefined && p.stock > 0 && p.stock <= 10) {
      stockEl.textContent = 'Only ' + p.stock + ' left in stock';
      stockEl.style.cssText = 'font-size:11px;font-family:\'Inter\',sans-serif;color:#f87171;letter-spacing:.06em;margin-top:8px;display:block';
    } else if (soldOut) {
      stockEl.textContent = 'Currently sold out';
      stockEl.style.cssText = 'font-size:11px;font-family:\'Inter\',sans-serif;color:rgba(245,240,232,.4);letter-spacing:.06em;margin-top:8px;display:block';
    } else {
      stockEl.textContent = 'In stock';
      stockEl.style.cssText = 'font-size:11px;font-family:\'Inter\',sans-serif;color:#4ade80;letter-spacing:.06em;margin-top:8px;display:block';
    }
  }

  // Colorways
  var colors = p.colorways || [{name:'Classic',hex: p.color||'#0D0D0D'}];
  document.getElementById('pdp-color-label-head').textContent = 'Colorway — ' + colors[0].name;
  document.getElementById('pdp-colorways').innerHTML = colors.map(function(c,i){
    return '<div class="pdp-color-swatch' + (i===0?' active':'') + '" style="background:' + c.hex + '" title="' + c.name + '" data-name="' + c.name + '" onclick="pdpSelectColor(this)"></div>';
  }).join('') + '<span class="pdp-color-label" id="pdp-active-color">' + colors[0].name + '</span>';

  // Highlights
  var hi = p.highlights || ['Premium quality construction','Designed for movement and style','Unisex sizing','Lightweight and breathable'];
  document.getElementById('pdp-highlights-list').innerHTML = hi.map(function(h){ return '<li>' + h + '</li>'; }).join('');

  // Specs
  var sp = p.specs || {Category:p.category||'—', Style:p.style||'Unisex', Sizes:p.sizes||'—'};
  document.getElementById('pdp-specs-table').innerHTML = Object.keys(sp).map(function(k){
    return '<tr><td>' + k + '</td><td>' + sp[k] + '</td></tr>';
  }).join('');

  // Story
  var st = p.story || {heading:'Victory Through Harmony', quote:'Every piece tells a story.', body:['Designed with intention — to move with you, not against you.']};
  document.getElementById('pdp-story-content').innerHTML =
    (st.heading ? '<h3>' + st.heading + '</h3>' : '') +
    (st.quote   ? '<blockquote>' + st.quote + '</blockquote>' : '') +
    (st.body    ? st.body.map(function(b){ return '<p>' + b + '</p>'; }).join('') : '');

  // Reset tab
  pdpTab('highlights', document.querySelector('.pdp-tab-btn'));

  showPage('pdp');
  window.scrollTo({top:0,behavior:'instant'});
}

function pdpSetImage(url, thumbEl) {
  document.getElementById('pdp-main-img').src = url;
  document.getElementById('pdp-main-img').style.transform = '';
  document.querySelectorAll('.pdp-thumb').forEach(function(t){t.classList.remove('active');});
  if (thumbEl) thumbEl.classList.add('active');
  _pdpZoomed = false;
  document.getElementById('pdp-viewer').classList.remove('zoomed');
  document.getElementById('pdp-zoom-badge').textContent = '+ Zoom';
}

function pdpToggleZoom() {
  _pdpZoomed = !_pdpZoomed;
  var viewer = document.getElementById('pdp-viewer');
  var badge  = document.getElementById('pdp-zoom-badge');
  if (_pdpZoomed) {
    viewer.classList.add('zoomed');
    badge.textContent = '− Zoom';
  } else {
    viewer.classList.remove('zoomed');
    badge.textContent = '+ Zoom';
    document.getElementById('pdp-main-img').style.transform = 'scale(1)';
  }
}

function pdpPanZoom(e) {
  if (!_pdpZoomed) return;
  var viewer = document.getElementById('pdp-viewer');
  var img    = document.getElementById('pdp-main-img');
  var rect   = viewer.getBoundingClientRect();
  var x = (e.clientX - rect.left) / rect.width;
  var y = (e.clientY - rect.top)  / rect.height;
  var scale = 2.4;
  var tx = (0.5 - x) * (scale - 1) * 100 / scale;
  var ty = (0.5 - y) * (scale - 1) * 100 / scale;
  img.style.transform = 'scale(' + scale + ') translate(' + tx + '%, ' + ty + '%)';
}

function pdpSelectSize(btn) {
  if (btn.classList.contains('out')) return;
  document.querySelectorAll('.pdp-size-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
}

function pdpSelectColor(swatch) {
  document.querySelectorAll('.pdp-color-swatch').forEach(function(s){s.classList.remove('active');});
  swatch.classList.add('active');
  var label = document.getElementById('pdp-active-color');
  if (label) label.textContent = swatch.dataset.name || '';
  var head = document.getElementById('pdp-color-label-head');
  if (head) head.textContent = 'Colorway — ' + (swatch.dataset.name || '');
}

function pdpTab(name, btn) {
  document.querySelectorAll('.pdp-tab-panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.pdp-tab-btn').forEach(function(b){b.classList.remove('active');});
  var panel = document.getElementById('pdp-panel-' + name);
  if (panel) panel.classList.add('active');
  if (btn) { btn.classList.add('active'); }
  else { var first = document.querySelector('.pdp-tab-btn'); if (first) first.classList.add('active'); }
}

function pdpAddToCart() {
  if (!_pdpProduct) return;
  var activeSize = document.querySelector('.pdp-size-btn.active');
  if (!activeSize) { showToast('Please select a size'); return; }
  addToCart(_pdpProduct.id, activeSize.textContent.trim());
}
function pdpBuyNow() {
  if (!_pdpProduct) return;
  var activeSize = document.querySelector('.pdp-size-btn.active');
  if (!activeSize) { showToast('Please select a size'); return; }
  addToCart(_pdpProduct.id, activeSize.textContent.trim());
  showPage(window._pdpReturn||'shop');
  toggleCart();
}

// ── CART ──
function addToCart(pid, size) {
  var p = products.find(function(x){return x.id===pid;});
  if (!p) return;
  if (!size) {
    var sizeEl = document.getElementById('size-' + pid);
    size = sizeEl ? sizeEl.value : '';
  }
  if (!size) { showToast('Please select a size'); return; }
  var ex = cart.find(function(c){return c.id===pid && c.size===size;});
  if (ex) { ex.qty++; } else { cart.push(Object.assign({}, p, {size:size, qty:1})); }
  updateCartDisplay();
  showToast(p.name + ' added to bag');
}

function updateCartDisplay() {
  var count = cart.reduce(function(s,i){return s+i.qty;}, 0);
  document.getElementById('cart-count').textContent = count;
  var list = document.getElementById('cart-items-list');
  var footer = document.getElementById('cart-footer');
  if (!list) return;
  if (!cart.length) {
    list.innerHTML = '<div class="cart-empty">Your bag is beautifully empty.</div>';
    if (footer) footer.style.display = 'none';
    return;
  }
  if (footer) footer.style.display = 'block';
  list.innerHTML = cart.map(function(item, idx) {
    return '<div class="cart-item">' +
      '<div class="cart-item-img">' +
        (item.imageUrl
          ? '<img src="' + item.imageUrl + '" style="width:100%;height:100%;object-fit:cover;object-position:top center" onerror="this.style.display=\'none\'">'
          : LOGO_SVG('#0e1c38', 28)) +
      '</div>' +
      '<div class="cart-item-info">' +
        '<div class="cart-item-name">' + item.name + '</div>' +
        '<div class="cart-item-size">Size: ' + item.size + ' &middot; Qty: ' + item.qty + '</div>' +
        '<div class="cart-item-price">' + (currentCurrency==='NGN' ? '\u20A6'+(item.priceNGN*item.qty).toLocaleString() : '$'+(item.priceUSD*item.qty)) + '</div>' +
        '<button onclick="removeFromCart(' + idx + ')" style="margin-top:8px;background:none;border:none;padding:0;font-family:\'Inter\',sans-serif;font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px" onmouseover="this.style.color=\'#FF2D2D\'" onmouseout="this.style.color=\'\'">Remove</button>' +
      '</div></div>';
  }).join('');
  var total = currentCurrency === 'NGN'
    ? '\u20A6' + cart.reduce(function(s,i){return s+i.priceNGN*i.qty;},0).toLocaleString()
    : '$' + cart.reduce(function(s,i){return s+i.priceUSD*i.qty;},0);
  var te = document.getElementById('cart-total'); if (te) te.textContent = total;

  // Upsell: You might also like
  var upsellEl = document.getElementById('cart-upsell');
  if (upsellEl) {
    var cartIds = cart.map(function(i){ return i.id; });
    var cartCats = cart.map(function(i){ return i.category; });
    var suggestions = products.filter(function(p) {
      return p.status !== 'inactive' && cartIds.indexOf(p.id) === -1 && (cartCats.indexOf(p.category) > -1);
    }).slice(0, 3);
    if (!suggestions.length) suggestions = products.filter(function(p){ return cartIds.indexOf(p.id) === -1; }).slice(0, 3);
    if (suggestions.length) {
      upsellEl.innerHTML = '<div style="padding:20px 32px 0;border-top:1px solid var(--border)">' +
        '<div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-family:\'Inter\',sans-serif">You Might Also Like</div>' +
        '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">' +
        suggestions.map(function(p) {
          return '<div style="flex:0 0 90px;cursor:pointer" onclick="toggleCart();openPDP(' + p.id + ')">' +
            '<div style="width:90px;height:110px;background:' + (p.imageUrl ? '#f5f0e8' : 'linear-gradient(135deg,' + p.color + '88,' + p.color + ')') + ';overflow:hidden;margin-bottom:6px">' +
            (p.imageUrl ? '<img src="' + p.imageUrl + '" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">' : '') +
            '</div>' +
            '<div style="font-size:11px;font-family:\'Barlow Condensed\',sans-serif;font-weight:600;color:var(--navy);line-height:1.2;margin-bottom:2px">' + p.name + '</div>' +
            '<div style="font-size:11px;font-family:\'Inter\',sans-serif;color:var(--muted)">' + fmtPrice(p) + '</div>' +
            '</div>';
        }).join('') +
        '</div></div>';
      upsellEl.style.display = '';
    } else {
      upsellEl.style.display = 'none';
    }
  }
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  updateCartDisplay();
}

function toggleCart() {
  document.getElementById('cart-sidebar').classList.toggle('open');
  document.getElementById('cart-overlay').classList.toggle('visible');
}


// ── Storefront functions ──

    +'</table>'
    +'<hr style="margin:24px 0;border:none;border-top:1px solid #eee">'
    +'<p style="white-space:pre-wrap;line-height:1.7">'+escHtml(msg)+'</p>'
    +'</div>';

  try {
    var emailSubject = 'Contact: '+subject+' — '+fname+' '+lname;
    var [sendRes, storeRes] = await Promise.all([
      fetch('/api/send-email', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ to:'info@klotworld.com', subject:emailSubject, html:html, fromName:'KLOT Website', fromEmail:'hello@klotworld.com' })
      }),
      fetch('/api/store-contact', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ from:fname+' '+lname+' <'+email+'>', subject:emailSubject, html:html, text:msg })
      })
    ]);
    var data = await sendRes.json();
    if(data.id) {
      showToast('Message sent! We\'ll be in touch within 24 hours.');
      ['cf-fname','cf-lname','cf-email','cf-msg'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
      var sel=document.getElementById('cf-subject'); if(sel){sel.value='';sel.closest('.cf-field').classList.remove('has-val');}
    } else {
      showToast('Could not send — please email us directly at info@klotworld.com');
    }
  } catch(e) {
    showToast('Network error — please email us at info@klotworld.com');
  } finally {
    if(btn) { btn.disabled=false; btn.textContent='Send Message'; }
  }
}

function populateCustomers() {
  var q = (document.getElementById('cust-search') || {value:''}).value.toLowerCase();
  var filtered = customers.filter(function(c) {
    return !q || c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q);
  });

  // Sort: VIP first, then by total desc
  filtered.sort(function(a, b) {
    if (a.status === 'vip' && b.status !== 'vip') return -1;
    if (b.status === 'vip' && a.status !== 'vip') return  1;
    return b.total - a.total;
  });

  var ce = document.getElementById('cust-count');
  if (ce) ce.textContent = customers.length + ' customer' + (customers.length !== 1 ? 's' : '');

  var tbody = document.getElementById('customers-body');

  if (!tbody) return;

    tbody.innerHTML = '';

function addOrUpdateCustomer(customerData, orderTotal) {
  // customerData = {firstName, lastName, email, phone, city, state}
  var fullName = customerData.firstName + ' ' + customerData.lastName;
  var location = [customerData.city, customerData.state].filter(Boolean).join(', ') || 'Nigeria';
  var today    = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});

  // Check if customer already exists by email
  var existing = customers.find(function(c) {
    return c.email.toLowerCase() === customerData.email.toLowerCase();
  });

  if (existing) {
    existing.orders++;
    existing.total    += orderTotal;
    existing.lastOrder = today;
    if (customerData.address) existing.address = customerData.address;
    if (existing.location === 'Nigeria' && location !== 'Nigeria') existing.location = location;
    if (existing.orders >= 5) existing.status = 'vip';
  } else {
    customers.unshift({
      name:      fullName,
      email:     customerData.email,
      phone:     customerData.phone || '',
      orders:    1,
      total:     orderTotal,
      lastOrder: today,
      location:  location,
      address:   customerData.address || '',
      status:    'active'
    });
  }
  persistCustomers();
  populateCustomers();
}


function openCheckout() {
  if (!cart.length) { showToast('Your bag is empty'); return; }
  toggleCart(); // close cart sidebar

  // Populate order summary
  var list = document.getElementById('checkout-items-list');
  if (list) {
    list.innerHTML = cart.map(function(item) {
      var imgHtml = item.imageUrl
        ? '<img src="' + item.imageUrl + '" style="width:100%;height:100%;object-fit:cover" onerror="this.onerror=null;this.style.display=\'none\'">' 
        : '<svg viewBox="0 0 60 70" fill="none" style="width:22px;opacity:.3"><rect x="0" y="0" width="17" height="28" fill="#f5f0e8"/><rect x="0" y="32" width="17" height="38" fill="#f5f0e8"/><rect x="21.5" y="10" width="17" height="18" fill="#f5f0e8"/><rect x="21.5" y="32" width="17" height="38" fill="#f5f0e8"/><rect x="43" y="0" width="17" height="28" fill="#f5f0e8"/><rect x="43" y="32" width="17" height="38" fill="#f5f0e8"/></svg>';
      var lineTotal = currentCurrency === 'NGN'
        ? '₦' + (item.priceNGN * item.qty).toLocaleString()
        : '$' + (item.priceUSD * item.qty).toFixed(2);
      return '<div class="co-item">' +
        '<div class="co-item-img">' + imgHtml + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="co-item-name">' + item.name + '</div>' +
          '<div class="co-item-meta">Size: ' + item.size + ' &nbsp;&middot;&nbsp; Qty: ' + item.qty + '</div>' +
        '</div>' +
        '<div class="co-item-price">' + lineTotal + '</div>' +
      '</div>';
    }).join('');
  }

  // Grand total
  var totalNGN = cart.reduce(function(s,i) { return s + i.priceNGN * i.qty; }, 0);
  var totalUSD = cart.reduce(function(s,i) { return s + i.priceUSD * i.qty; }, 0);
  var grandEl = document.getElementById('checkout-grand-total');
  if (grandEl) grandEl.textContent = currentCurrency === 'NGN'
    ? '₦' + totalNGN.toLocaleString()
    : '$' + totalUSD.toFixed(2);

  // Currency note — Paystack charges in NGN, show USD equivalent info
  var noteEl = document.getElementById('co-currency-note');
  if (noteEl) {
    if (currentCurrency === 'USD') {
      noteEl.textContent = 'Payment processed in NGN (₦' + totalNGN.toLocaleString() + '). USD displayed for reference only.';
      noteEl.classList.add('show');
    } else {
      noteEl.classList.remove('show');
    }
  }

  // Update pay button label
  updatePayLabel();

  // Clear errors
  var errEl = document.getElementById('checkout-error'); if (errEl) errEl.textContent = '';

  document.getElementById('checkout-overlay').classList.add('open');
  setTimeout(function() { var el=document.getElementById('co-firstname'); if(el)el.focus(); }, 200);
}

function validateCheckoutForm() {
  var errEl = document.getElementById('checkout-error');
  var fn = (document.getElementById('co-firstname').value || '').trim();
  var ln = (document.getElementById('co-lastname').value  || '').trim();
  var em = (document.getElementById('co-email').value     || '').trim();
  var ad = (document.getElementById('co-address').value   || '').trim();

  if (!fn || !ln)  { errEl.textContent = 'Please enter your full name.'; return null; }
  if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { errEl.textContent = 'Please enter a valid email address.'; return null; }
  if (!ad) { errEl.textContent = 'Please enter your delivery address.'; return null; }
  errEl.textContent = '';

  return {
    firstName: fn,
    lastName:  ln,
    email:     em,
    phone:     (document.getElementById('co-phone').value   || '').trim(),
    address:   ad,
    city:      (document.getElementById('co-city').value    || '').trim(),
    state:     (document.getElementById('co-state').value   || '').trim()
  };
}


function initiatePaystack() {
  var customer = validateCheckoutForm();
  if (!customer) return;

  var totalNGN = cart.reduce(function(s,i) { return s + i.priceNGN * i.qty; }, 0);
  // Paystack amount is in kobo (NGN x 100)
  var amountKobo = totalNGN * 100;

  // Build order reference
  var ref = 'MN-' + Date.now() + '-' + Math.random().toString(36).substr(2,5).toUpperCase();

  // Build items summary for metadata
  var itemsSummary = cart.map(function(i) {
    return i.name + ' (x' + i.qty + ', size ' + i.size + ')';
  }).join('; ');

  var btn = document.getElementById('checkout-pay-btn');
  if (btn) { btn.disabled = true; document.getElementById('checkout-pay-label').textContent = 'Opening payment…'; }

  // Check Paystack is loaded
  if (typeof PaystackPop === 'undefined') {
    var errEl = document.getElementById('checkout-error');
    if (errEl) errEl.textContent = 'Payment gateway not loaded. Please check your internet connection and try again.';
    if (btn) { btn.disabled = false; updatePayLabel(); }
    return;
  }

  var handler = PaystackPop.setup({
    key:       PAYSTACK_PUBLIC_KEY,
    email:     customer.email,
    amount:    amountKobo,
    currency:  'NGN',
    ref:       ref,
    firstname: customer.firstName,
    lastname:  customer.lastName,
    phone:     customer.phone,
    metadata: {
      custom_fields: [
        { display_name: 'Customer Name',     variable_name: 'customer_name',    value: customer.firstName + ' ' + customer.lastName },
        { display_name: 'Delivery Address',  variable_name: 'delivery_address', value: customer.address + ', ' + customer.city + ', ' + customer.state },
        { display_name: 'Items Ordered',     variable_name: 'items_ordered',    value: itemsSummary },
        { display_name: 'Order Reference',   variable_name: 'order_reference',  value: ref }
      ]
    },
    onClose: function() {
      if (btn) { btn.disabled = false; updatePayLabel(); }
      showToast('Payment cancelled');
    },
    callback: function(response) {
      // Payment successful
      closeCheckoutDirect();
      // Add to orders list
      orders.unshift({
        id: ref,
        customer: customer.firstName + ' ' + customer.lastName,
        email: customer.email,
        phone: customer.phone || '',
        address: (customer.address || '') + (customer.city ? ', ' + customer.city : '') + (customer.state ? ', ' + customer.state : ''),
        items: cart.reduce(function(s,i) { return s+i.qty; }, 0),
        itemDetails: cart.map(function(i) { return { name: i.name, size: i.size, qty: i.qty, price: i.priceNGN }; }),
        total: totalNGN,
        status: 'processing',
        date: new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
      });
      // Add/update customer record
      addOrUpdateCustomer(customer, totalNGN);
      // Auto-send order confirmation email
      (function() {
        var itemsText = cart.map(function(i){ return i.qty+'× '+i.name+' ('+i.size+')'; }).join(', ');
        var confirmHtml = MC_TEMPLATES['order-confirmation'].render({
          name: customer.firstName,
          orderId: ref,
          items: itemsText,
          total: '₦'+totalNGN.toLocaleString(),
          date: new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})
        });
        fetch('/api/send-email', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ to:customer.email, subject:'Your KLOT order is confirmed — '+ref, html:confirmHtml, fromName:'KLOT', fromEmail:'hello@klotworld.com' })
        }).then(function(r){ return r.json(); }).then(function(d){
          if(!d.id) { console.error('[KLOT] Confirmation email failed:', JSON.stringify(d)); showToast('Order confirmed! (Confirmation email could not be sent — check admin logs)'); }
        }).catch(function(e){ console.error('[KLOT] Confirmation email error:', e); });
      })();
      // Clear cart
      cart = [];
      updateCartDisplay();
      populateAdmin();
      // Show success
      var refEl = document.getElementById('order-success-ref');
      if (refEl) refEl.textContent = 'Order Ref: ' + response.reference;
      document.getElementById('order-success-overlay').classList.add('open');
      if (btn) { btn.disabled = false; updatePayLabel(); }
    }
  });

  handler.openIframe();
}

function updateExecPhoto(slug, input) {
  if (!input.files || !input.files[0]) return;
  var file  = input.files[0];
  var maxMB = 5;

  if (file.size > maxMB * 1024 * 1024) {
    showToast('Photo must be under ' + maxMB + 'MB');
    return;
  }

  var wrap = document.getElementById('photo-wrap-' + slug);
  if (wrap) wrap.classList.add('team-photo-uploading');

  var reader = new FileReader();
  reader.onload = function(e) {
    var img = document.getElementById('team-photo-' + slug);
    if (!img) return;

    var newImg    = new Image();
    newImg.onload = function() {
      img.src = e.target.result;
      img.style.display = 'block';
      if (wrap) wrap.classList.remove('team-photo-uploading');
      img.classList.add('team-photo-updated');
      setTimeout(function() { img.classList.remove('team-photo-updated'); }, 700);
      showToast('Photo updated successfully');
    };
    newImg.onerror = function() {
      if (wrap) wrap.classList.remove('team-photo-uploading');
      showToast('Could not load image — try a different file');
    };
    newImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
  // Reset input so same file can be re-selected if needed
  input.value = '';
}
