<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a6840" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9a8860" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a8860" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9a8860" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg6)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9a8860" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid6)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- trench body long -->
      <path d="M145 110 L118 145 L105 390 L295 390 L287 145 L255 110" fill="#9a8860" stroke="#0e1c38" stroke-width="2"/>
      <!-- double breast buttons -->
      <circle cx="188" cy="200" r="5" fill="#0e1c38" opacity="0.7"/>
      <circle cx="188" cy="230" r="5" fill="#0e1c38" opacity="0.7"/>
      <circle cx="188" cy="260" r="5" fill="#0e1c38" opacity="0.7"/>
      <circle cx="212" cy="200" r="5" fill="#0e1c38" opacity="0.7"/>
      <circle cx="212" cy="230" r="5" fill="#0e1c38" opacity="0.7"/>
      <circle cx="212" cy="260" r="5" fill="#0e1c38" opacity="0.7"/>
      <!-- lapels -->
      <path d="M145 110 L178 175 L200 158 L200 390" fill="#7a6840" stroke="#0e1c38" stroke-width="1.5"/>
      <path d="M255 110 L222 175 L200 158" fill="#7a6840" stroke="#0e1c38" stroke-width="1.5"/>
      <!-- sleeves -->
      <path d="M118 145 L78 310 L106 318 L128 175" fill="#9a8860" stroke="#0e1c38" stroke-width="1.5"/>
      <path d="M282 145 L322 310 L294 318 L272 175" fill="#9a8860" stroke="#0e1c38" stroke-width="1.5"/>
      <!-- belt -->
      <rect x="148" y="245" width="104" height="12" rx="2" fill="#7a6840"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf6)"/>
  <rect x="0" y="398" width="400" height="1" fill="#9a8860" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="69" height="16" rx="2" fill="#2a6b2a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">FASHION</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#5a6e7f">MN-006</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Editorial Trench C…</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#9a8860"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#9a8860"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#9a8860"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#9a8860"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#9a8860"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#9a8860"/>
  </g>
</svg>