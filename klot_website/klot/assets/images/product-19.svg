<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3a1a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3a4a2a" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf19" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a2a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3a4a2a" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg19)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid19" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a4a2a" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid19)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- body -->
      <path d="M148 118 L120 148 L115 320 L285 320 L280 148 L252 118" fill="#3a4a2a" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <!-- sleeves -->
      <path d="M120 148 L80 275 L108 283 L135 175" fill="#3a4a2a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <path d="M280 148 L320 275 L292 283 L265 175" fill="#3a4a2a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- hood attached -->
      <path d="M158 118 L148 78 L200 60 L252 78 L242 118 L200 108Z" fill="#2a3a1a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- zip -->
      <line x1="200" y1="118" x2="200" y2="320" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="5,2.5"/>
      <!-- chest pocket -->
      <rect x="158" y="165" width="38" height="30" rx="3" fill="#2a3a1a" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf19)"/>
  <rect x="0" y="398" width="400" height="1" fill="#3a4a2a" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="62" height="16" rx="2" fill="#0e1c38"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">SPORTS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-019</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Trail Windbreaker</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#3a4a2a"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#3a4a2a"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#3a4a2a"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#3a4a2a"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#3a4a2a"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#3a4a2a"/>
  </g>
</svg>