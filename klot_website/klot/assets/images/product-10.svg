<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a30" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3d2a42" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2a42" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3d2a42" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg10)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid10" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3d2a42" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid10)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- bra band -->
      <path d="M130 240 Q200 290 270 240 L270 265 Q200 315 130 265Z" fill="#3d2a42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- left cup -->
      <path d="M130 240 Q165 175 200 195 Q165 248 130 265Z" fill="#3d2a42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- right cup -->
      <path d="M200 195 Q235 175 270 240 L270 265 Q235 248 200 195Z" fill="#3d2a42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- straps -->
      <path d="M152 237 L168 135" stroke="#2a1a30" stroke-width="5" stroke-linecap="round"/>
      <path d="M248 237 L232 135" stroke="#2a1a30" stroke-width="5" stroke-linecap="round"/>
      <!-- racerback -->
      <path d="M168 135 Q200 155 232 135" stroke="#2a1a30" stroke-width="5" fill="none" stroke-linecap="round"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf10)"/>
  <rect x="0" y="398" width="400" height="1" fill="#3d2a42" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="62" height="16" rx="2" fill="#0e1c38"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">SPORTS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-010</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Yoga Luxe Bra</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#3d2a42"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#3d2a42"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#3d2a42"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#3d2a42"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#3d2a42"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#3d2a42"/>
  </g>
</svg>