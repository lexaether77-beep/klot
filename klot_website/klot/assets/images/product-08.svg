<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0b090" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4c4a8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4a8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4c4a8" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg8)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid8" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d4c4a8" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid8)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- body -->
      <path d="M148 118 L122 148 L118 325 L282 325 L278 148 L252 118" fill="#d4c4a8" stroke="#0e1c38" stroke-width="2"/>
      <!-- sleeves -->
      <path d="M122 148 L82 275 L110 283 L138 175" fill="#d4c4a8" stroke="#0e1c38" stroke-width="1.5"/>
      <path d="M278 148 L318 275 L290 283 L262 175" fill="#d4c4a8" stroke="#0e1c38" stroke-width="1.5"/>
      <!-- hood -->
      <path d="M158 118 L150 78 L200 62 L250 78 L242 118 L200 108Z" fill="#c0b090" stroke="#0e1c38" stroke-width="1.5"/>
      <!-- kangaroo pocket -->
      <path d="M160 250 L160 295 L240 295 L240 250 Q200 240 160 250Z" fill="#c0b090" stroke="#0e1c38" stroke-width="1.2"/>
      <!-- rib hem -->
      <rect x="116" y="321" width="168" height="18" rx="3" fill="#c0b090"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf8)"/>
  <rect x="0" y="398" width="400" height="1" fill="#d4c4a8" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="69" height="16" rx="2" fill="#2a6b2a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">FASHION</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#5a6e7f">MN-008</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Cashmere Hoodie</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#d4c4a8"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#d4c4a8"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#d4c4a8"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#d4c4a8"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#d4c4a8"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#d4c4a8"/>
  </g>
</svg>