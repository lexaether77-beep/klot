<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c8b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8e0d0" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e8e0d0" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg17)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid17" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8e0d0" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid17)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- waistband -->
      <rect x="148" y="105" width="104" height="20" rx="3" fill="#d4c8b0"/>
      <!-- wide legs -->
      <path d="M148 125 L108 370 L195 370 L200 210 L205 370 L292 370 L252 125Z" fill="#e8e0d0" stroke="#0e1c38" stroke-width="1.8"/>
      <!-- crease line -->
      <line x1="148" y1="125" x2="115" y2="370" stroke="#d4c8b0" stroke-width="1.5" opacity="0.4"/>
      <line x1="252" y1="125" x2="285" y2="370" stroke="#d4c8b0" stroke-width="1.5" opacity="0.4"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf17)"/>
  <rect x="0" y="398" width="400" height="1" fill="#e8e0d0" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="69" height="16" rx="2" fill="#2a6b2a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">FASHION</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#5a6e7f">MN-017</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Linen Wide-Leg Pant</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#e8e0d0"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#e8e0d0"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#e8e0d0"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#e8e0d0"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#e8e0d0"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#e8e0d0"/>
  </g>
</svg>