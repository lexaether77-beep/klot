<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2d42" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg9)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid9" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0d1b2a" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid9)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- puffer body quilted -->
      <path d="M158 108 L135 135 L128 320 L272 320 L265 135 L242 108" fill="#0d1b2a" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <!-- quilt lines -->
      <line x1="130" y1="165" x2="270" y2="165" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" opacity="0.4"/>
      <line x1="128" y1="205" x2="272" y2="205" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" opacity="0.4"/>
      <line x1="128" y1="245" x2="272" y2="245" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" opacity="0.4"/>
      <line x1="128" y1="285" x2="272" y2="285" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" opacity="0.4"/>
      <!-- armholes -->
      <path d="M158 108 L135 135 L118 175 L140 180 L162 138" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.8"/>
      <path d="M242 108 L265 135 L282 175 L260 180 L238 138" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.8"/>
      <!-- zip -->
      <line x1="200" y1="108" x2="200" y2="320" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-dasharray="4,2"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf9)"/>
  <rect x="0" y="398" width="400" height="1" fill="#0d1b2a" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="48" height="16" rx="2" fill="#5a3a7a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">KIDS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-009</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Kids Puffer Vest</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#0d1b2a"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#0d1b2a"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#0d1b2a"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#0d1b2a"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#0d1b2a"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#0d1b2a"/>
  </g>
</svg>