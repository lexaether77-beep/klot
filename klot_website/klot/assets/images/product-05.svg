<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b4aa96" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8bfaa" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8bfaa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c8bfaa" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg5)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c8bfaa" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid5)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- body -->
      <path d="M145 115 L120 145 L115 320 L285 320 L280 145 L255 115" fill="#c8bfaa" stroke="#0e1c38" stroke-width="2"/>
      <!-- sleeves -->
      <path d="M120 145 L80 270 L108 278 L135 170 L120 145" fill="#c8bfaa" stroke="#0e1c38" stroke-width="1.5"/>
      <path d="M280 145 L320 270 L292 278 L265 170 L280 145" fill="#c8bfaa" stroke="#0e1c38" stroke-width="1.5"/>
      <!-- rib cuffs -->
      <rect x="78" y="267" width="33" height="16" rx="3" fill="#b4aa96"/>
      <rect x="289" y="267" width="33" height="16" rx="3" fill="#b4aa96"/>
      <!-- rib hem -->
      <rect x="113" y="316" width="174" height="18" rx="3" fill="#b4aa96"/>
      <!-- hood -->
      <path d="M155 115 L148 85 L200 70 L252 85 L245 115 L200 110Z" fill="#b4aa96" stroke="#0e1c38" stroke-width="1.5"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf5)"/>
  <rect x="0" y="398" width="400" height="1" fill="#c8bfaa" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="48" height="16" rx="2" fill="#5a3a7a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">KIDS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#5a6e7f">MN-005</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Mini Luxe Sweatshirt</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#c8bfaa"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#c8bfaa"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#c8bfaa"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#c8bfaa"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#c8bfaa"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#c8bfaa"/>
  </g>
</svg>