<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3d52" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a2d42" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d42" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a2d42" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg1)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d42" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid1)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- jacket body -->
      <path d="M140 120 L110 145 L95 200 L95 340 L305 340 L305 200 L290 145 L260 120" fill="#2a3d52" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <!-- lapels -->
      <path d="M140 120 L175 180 L200 160 L200 340" fill="#1a2d42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <path d="M260 120 L225 180 L200 160" fill="#1a2d42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- sleeves -->
      <path d="M110 145 L70 280 L95 285 L120 180 L110 145" fill="#1a2d42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <path d="M290 145 L330 280 L305 285 L280 180 L290 145" fill="#1a2d42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- collar -->
      <path d="M155 115 L200 95 L245 115 L260 120 L200 150 L140 120Z" fill="#2a3d52" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf1)"/>
  <rect x="0" y="398" width="400" height="1" fill="#1a2d42" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="69" height="16" rx="2" fill="#2a6b2a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">FASHION</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-001</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">The Obsidian Jacket</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#1a2d42"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#1a2d42"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#1a2d42"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#1a2d42"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#1a2d42"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#1a2d42"/>
  </g>
</svg>