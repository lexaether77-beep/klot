<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2d42" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg16)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid16" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0d1b2a" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid16)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- waistband -->
      <rect x="138" y="100" width="124" height="22" rx="4" fill="#1a2d42"/>
      <!-- left leg tight -->
      <path d="M138 122 L132 340 L192 340 L200 218 L208 340 L268 340 L262 122Z" fill="#0d1b2a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- seam panels -->
      <line x1="160" y1="122" x2="155" y2="340" stroke="#1a2d42" stroke-width="1.8" opacity="0.45"/>
      <line x1="240" y1="122" x2="245" y2="340" stroke="#1a2d42" stroke-width="1.8" opacity="0.45"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf16)"/>
  <rect x="0" y="398" width="400" height="1" fill="#0d1b2a" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="62" height="16" rx="2" fill="#0e1c38"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">SPORTS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-016</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Ultra Stretch Tight</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#0d1b2a"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#0d1b2a"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#0d1b2a"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#0d1b2a"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#0d1b2a"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#0d1b2a"/>
  </g>
</svg>