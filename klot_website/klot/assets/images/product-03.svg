<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2d38" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2a3d4a" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3d4a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2a3d4a" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg3)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3d4a" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid3)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- vest body -->
      <path d="M155 105 L130 130 L120 320 L280 320 L270 130 L245 105" fill="#2a3d4a" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <!-- armholes -->
      <path d="M155 105 L130 130 L115 170 L135 175 L155 135" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <path d="M245 105 L270 130 L285 170 L265 175 L245 135" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
      <!-- zip line -->
      <line x1="200" y1="105" x2="200" y2="320" stroke="rgba(255,255,255,0.18)" stroke-width="2.5" stroke-dasharray="6,3"/>
      <!-- collar -->
      <path d="M165 105 L200 88 L235 105 L245 105 L200 125 L155 105Z" fill="#1a2d38" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf3)"/>
  <rect x="0" y="398" width="400" height="1" fill="#2a3d4a" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="62" height="16" rx="2" fill="#0e1c38"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">SPORTS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-003</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Precision Run Vest</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#2a3d4a"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#2a3d4a"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#2a3d4a"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#2a3d4a"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#2a3d4a"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#2a3d4a"/>
  </g>
</svg>