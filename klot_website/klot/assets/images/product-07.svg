<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a2d42" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d42" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a2d42" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg7)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid7" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d42" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid7)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- waistband -->
      <rect x="140" y="105" width="120" height="22" rx="4" fill="#0d1b2a"/>
      <!-- shorts body -->
      <path d="M140 127 L135 240 L188 240 L200 185 L212 240 L265 240 L260 127Z" fill="#1a2d42" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- side stripe -->
      <rect x="136" y="127" width="8" height="113" rx="2" fill="#0d1b2a" opacity="0.6"/>
      <rect x="256" y="127" width="8" height="113" rx="2" fill="#0d1b2a" opacity="0.6"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf7)"/>
  <rect x="0" y="398" width="400" height="1" fill="#1a2d42" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="62" height="16" rx="2" fill="#0e1c38"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">SPORTS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-007</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Sprint Elite Shorts</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#1a2d42"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#1a2d42"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#1a2d42"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#1a2d42"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#1a2d42"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#1a2d42"/>
  </g>
</svg>