<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a2a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2a4a3a" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a3a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2a4a3a" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg12)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid12" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a4a3a" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid12)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- top -->
      <path d="M158 100 L138 125 L135 210 L265 210 L262 125 L242 100" fill="#2a4a3a" stroke="rgba(255,255,255,0.18)" stroke-width="1.8"/>
      <!-- top sleeves short -->
      <path d="M138 125 L112 188 L136 194 L152 145" fill="#2a4a3a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <path d="M262 125 L288 188 L264 194 L248 145" fill="#2a4a3a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- shorts waistband -->
      <rect x="145" y="225" width="110" height="18" rx="3" fill="#1a3a2a"/>
      <!-- shorts -->
      <path d="M145 243 L142 335 L192 335 L200 285 L208 335 L258 335 L255 243Z" fill="#2a4a3a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf12)"/>
  <rect x="0" y="398" width="400" height="1" fill="#2a4a3a" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="48" height="16" rx="2" fill="#5a3a7a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">KIDS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-012</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Mini Sport Set</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#2a4a3a"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#2a4a3a"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#2a4a3a"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#2a4a3a"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#2a4a3a"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#2a4a3a"/>
  </g>
</svg>