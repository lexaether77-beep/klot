<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg" width="400" height="480">
  <defs>
    <linearGradient id="bg-kofi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1c38"/>
      <stop offset="100%" stop-color="#162d52"/>
    </linearGradient>
    <linearGradient id="body-kofi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1c38" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#162d52" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="skin-kofi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#c09a78"/>
    </linearGradient>
    <clipPath id="circle-kofi">
      <circle cx="200" cy="158" r="78"/>
    </clipPath>
    <filter id="shadow-kofi">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#162d52" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bg-kofi)"/>

  <!-- Subtle texture grid -->
  <pattern id="grid-kofi" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="white" stroke-width="0.3" opacity="0.06"/>
  </pattern>
  <rect width="400" height="480" fill="url(#grid-kofi)"/>

  <!-- Brand M watermark background -->
  <g transform="translate(300,360)" opacity="0.07">
    <rect x="0"   y="0"  width="16" height="26" fill="white"/>
    <rect x="0"   y="30" width="16" height="36" fill="white"/>
    <rect x="20"  y="9"  width="16" height="17" fill="white"/>
    <rect x="20"  y="30" width="16" height="36" fill="white"/>
    <rect x="40"  y="0"  width="16" height="26" fill="white"/>
    <rect x="40"  y="30" width="16" height="36" fill="white"/>
  </g>

  <!-- Clothing / torso (below head) -->
  <path d="M 110 310 Q 140 285 200 280 Q 260 285 290 310 L 310 480 L 90 480 Z"
        fill="url(#body-kofi)"/>
  <!-- Collar detail -->
  <path d="M 175 285 L 200 320 L 225 285" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Collar left -->
  <path d="M 175 285 Q 155 295 150 320 L 200 320" fill="rgba(255,255,255,0.06)" stroke="none"/>
  <!-- Collar right -->
  <path d="M 225 285 Q 245 295 250 320 L 200 320" fill="rgba(255,255,255,0.06)" stroke="none"/>

  <!-- Neck -->
  <rect x="183" y="226" width="34" height="58" rx="10" fill="url(#skin-kofi)"/>

  <!-- Head / face circle -->
  <circle cx="200" cy="158" r="78" fill="url(#skin-kofi)" filter="url(#shadow-kofi)"/>

  <!-- Face features -->
  <!-- Eyebrows -->
  <path d="M 168 138 Q 178 133 190 136" stroke="#c09a78" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 210 136 Q 222 133 232 138" stroke="#c09a78" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Eyes -->
  <ellipse cx="179" cy="148" rx="9" ry="7" fill="#162d52"/>
  <ellipse cx="221" cy="148" rx="9" ry="7" fill="#162d52"/>
  <circle  cx="181" cy="147" r="3" fill="#0e1c38"/>
  <circle  cx="223" cy="147" r="3" fill="#0e1c38"/>
  <!-- Eye shine -->
  <circle cx="183" cy="145" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="225" cy="145" r="1.5" fill="white" opacity="0.7"/>
  <!-- Nose -->
  <path d="M 200 155 Q 194 168 197 174 Q 200 176 203 174 Q 206 168 200 155"
        fill="#c09a78" opacity="0.45"/>
  <!-- Mouth / smile -->
  <path d="M 186 188 Q 200 198 214 188" stroke="#c09a78" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Hair suggestion (top of head) -->
  <path d="M 125 140 Q 130 90 200 84 Q 270 90 275 140 Q 268 118 200 114 Q 132 118 125 140 Z"
        fill="#162d52" opacity="0.7"/>
  <!-- Side hair wisps -->
  <path d="M 122 158 Q 116 140 125 125" stroke="#162d52" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 278 158 Q 284 140 275 125" stroke="#162d52" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Name plate bottom -->
  <rect x="0" y="390" width="400" height="90" fill="rgba(0,0,0,0.35)"/>
  <rect x="0" y="390" width="400" height="1" fill="rgba(255,255,255,0.1)"/>

  <!-- Initials badge (top-left corner) -->
  <circle cx="36" cy="36" r="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="36" y="42" font-family="Georgia,serif" font-size="14" font-weight="400"
        text-anchor="middle" fill="white" opacity="0.8">KA</text>

  <!-- Name -->
  <text x="200" y="422" font-family="Georgia,serif" font-size="18" font-weight="400"
        text-anchor="middle" fill="white">Kofi Asante</text>
  <!-- Role -->
  <text x="200" y="446" font-family="Helvetica Neue,Arial,sans-serif" font-size="10"
        letter-spacing="2" text-anchor="middle" fill="rgba(255,255,255,0.55)"
        text-transform="uppercase">HEAD OF DESIGN</text>

  <!-- Update hint -->
  <text x="200" y="470" font-family="Helvetica Neue,Arial,sans-serif" font-size="9"
        letter-spacing="1" text-anchor="middle" fill="rgba(255,255,255,0.25)">REPLACE WITH PHOTO</text>
</svg>