<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0d05" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2a1a0d" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf18" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a0d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2a1a0d" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg18)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid18" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a1a0d" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid18)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- jacket top -->
      <path d="M152 100 L128 128 L124 220 L276 220 L272 128 L248 100" fill="#2a1a0d" stroke="rgba(255,255,255,0.18)" stroke-width="1.8"/>
      <!-- sleeves -->
      <path d="M128 128 L90 238 L116 245 L140 155" fill="#2a1a0d" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <path d="M272 128 L310 238 L284 245 L260 155" fill="#2a1a0d" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- collar -->
      <path d="M162 100 L200 88 L238 100 L248 100 L200 115 L152 100Z" fill="#1a0d05" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- jogger bottom waist -->
      <rect x="148" y="232" width="104" height="18" rx="3" fill="#1a0d05"/>
      <!-- legs -->
      <path d="M148 250 L142 370 L196 370 L200 300 L204 370 L258 370 L252 250Z" fill="#2a1a0d" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <!-- ankle cuffs -->
      <rect x="139" y="367" width="58" height="14" rx="3" fill="#1a0d05"/>
      <rect x="203" y="367" width="58" height="14" rx="3" fill="#1a0d05"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf18)"/>
  <rect x="0" y="398" width="400" height="1" fill="#2a1a0d" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="48" height="16" rx="2" fill="#5a3a7a"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">KIDS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#9aabad">MN-018</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Kids Luxe Tracksuit</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#2a1a0d"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#2a1a0d"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#2a1a0d"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#2a1a0d"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#2a1a0d"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#2a1a0d"/>
  </g>
</svg>