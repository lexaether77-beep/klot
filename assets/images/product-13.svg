<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" width="400" height="500">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0d0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f5f0e8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shelf13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f5f0e8" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#f5f0e8"/>
  <rect width="400" height="500" fill="url(#bg13)"/>

  <!-- Subtle grid texture -->
  <pattern id="grid13" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f5f0e8" stroke-width="0.4" opacity="0.08"/>
  </pattern>
  <rect width="400" height="500" fill="url(#grid13)"/>

  <!-- Product silhouette area (centred, product image zone 400x380) -->
  <g transform="translate(0, 30)">
    
      <!-- body -->
      <path d="M152 120 L128 148 L122 320 L278 320 L272 148 L248 120" fill="#f5f0e8" stroke="#0e1c38" stroke-width="1.8"/>
      <!-- short sleeves -->
      <path d="M128 148 L90 220 L118 228 L142 165" fill="#f5f0e8" stroke="#0e1c38" stroke-width="1.5"/>
      <path d="M272 148 L310 220 L282 228 L258 165" fill="#f5f0e8" stroke="#0e1c38" stroke-width="1.5"/>
      <!-- crew neck -->
      <path d="M162 120 Q200 105 238 120 L248 120 Q200 100 152 120Z" fill="#e8e0d0" stroke="#0e1c38" stroke-width="1.2"/>
    
  </g>

  <!-- Bottom info panel -->
  <rect x="0" y="400" width="400" height="100" fill="url(#shelf13)"/>
  <rect x="0" y="398" width="400" height="1" fill="#f5f0e8" opacity="0.15"/>

  <!-- Category label -->
  <rect x="16" y="412" width="62" height="16" rx="2" fill="#0e1c38"/>
  <text x="26" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="1.5" text-anchor="start" fill="white" text-transform="uppercase">SPORTS</text>

  <!-- SKU -->
  <text x="384" y="424" font-family="Helvetica Neue, Arial, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="end" fill="#5a6e7f">MN-013</text>

  <!-- Product name -->
  <text x="16" y="449" font-family="Georgia, serif" font-size="15" font-weight="400" text-anchor="start" fill="#0e1c38">Performance Tee</text>

  <!-- M mark watermark -->
  <g transform="translate(330, 418)" opacity="0.08">
    <rect x="0" y="0"   width="6.5"  height="11"  fill="#f5f0e8"/>
    <rect x="0" y="13"  width="6.5"  height="15"  fill="#f5f0e8"/>
    <rect x="8.3" y="4" width="6.5"  height="7.5" fill="#f5f0e8"/>
    <rect x="8.3" y="13" width="6.5" height="15"  fill="#f5f0e8"/>
    <rect x="16.5" y="0" width="6.5" height="11"  fill="#f5f0e8"/>
    <rect x="16.5" y="13" width="6.5" height="15" fill="#f5f0e8"/>
  </g>
</svg>